services:
  mock-upstream:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./deploy/mock_upstream.py:/app/mock_upstream.py:ro
    command: >
      sh -c "pip install --no-cache-dir -q fastapi uvicorn orjson && python /app/mock_upstream.py"
    environment:
      MOCK_UPSTREAM_PORT: "8001"
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  aegis-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mock-upstream:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      AEGIS_MODE: "enforce"
      AEGIS_UPSTREAM_URL: "http://mock-upstream:8001"
      AEGIS_MODEL_DIR: "/app/models/deberta_v3_small_aegis_v1"
      AEGIS_ALLOW_FALLBACK: "true"
      AEGIS_INTRA_OP_THREADS: "8"
      AEGIS_MAX_BATCH_SIZE: "4"
      AEGIS_MAX_QUEUE_SIZE: "128"
      AEGIS_AUDIT_FORMAT: "json"
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      - aegis-proxy
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
