name: AegisLLM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime and dev dependencies (zero PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[runtime,dev,bench]"

      - name: Ruff lint
        run: ruff check src/aegis tests/test_engine.py tests/test_security_p1.py tests/test_proxy_p1.py tests/test_redteam.py

      - name: Mypy strict check (src/aegis)
        run: mypy --strict --ignore-missing-imports src/aegis/

      - name: Run unit, proxy, and OWASP LLM01 red-team test suites
        run: pytest -v tests/test_engine.py tests/test_security_p1.py tests/test_proxy_p1.py tests/test_redteam.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Build production non-root container image
        run: docker build -t aegis-llm:ci .

      - name: Verify image size budget (< 380 MB excluding weights) and non-root UID
        run: |
          SIZE_BYTES=$(docker image inspect aegis-llm:ci --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Built image size: ${SIZE_MB} MB"
          test "${SIZE_MB}" -lt 380
          USER_ID=$(docker run --rm --entrypoint id aegis-llm:ci -u)
          echo "Container UID: ${USER_ID}"
          test "${USER_ID}" -ne 0
