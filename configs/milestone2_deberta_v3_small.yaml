# AegisLLM - Milestone 2 Configuration (Single Source of Truth)
# Software Engineering for Deep Learning - ETSIINF (UPM)
# Authors: Evan Gendrot & Amaury Dubuc

project:
  name: "aegis-llm"
  milestone: "milestone-2-model-implementation"
  seed: 42

dataset:
  target_size: 24000
  splits:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
  quotas:
    benign: 12000
    hard_negative_devops: 3600
    benign_general: 8400
    prompt_injection: 7200
    direct_override: 4200
    indirect_rag: 3000
    jailbreak: 4800
    jailbreak_persona: 3000
    jailbreak_hypothetical: 1800
  clustering:
    shingle_size: 5
    num_permutations: 128
    lsh_threshold: 0.80
  labels:
    0: "BENIGN"
    1: "PROMPT_INJECTION"
    2: "JAILBREAK"

model:
  backbone: "microsoft/deberta-v3-small"
  num_labels: 3
  max_sequence_length: 512
  pad_to_multiple_of: 8

training:
  precision: "bf16"
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  epochs: 4
  optimizer:
    name: "adamw_torch_fused"
    backbone_lr: 2.5e-5
    head_lr: 1.0e-4
    llrd_decay: 0.90
    beta1: 0.9
    beta2: 0.98
    eps: 1.0e-6
    weight_decay: 0.01
    max_grad_norm: 1.0
  lr_scheduler:
    name: "cosine"
    warmup_ratio: 0.10
  loss:
    name: "CostSensitiveAsymmetricFocalLoss"
    class_weights: [1.0, 1.35, 1.65]
    gammas: [2.5, 1.5, 1.5]
    beta_fp: 2.25
    label_smoothing: 0.03
  evaluation:
    eval_strategy: "steps"
    eval_steps: 175
    metric_for_best_model: "eval_tpr_at_1pct_fpr"
    greater_is_better: true
    early_stopping_patience: 3

calibration:
  method: "temperature_scaling"
  max_iter: 50

baselines:
  tier1:
    name: "TF-IDF + Calibrated LinearSVC"
    word_ngram_range: [1, 3]
    char_ngram_range: [3, 5]
    max_features: 50000
    sublinear_tf: true
    calibration_method: "sigmoid"
    calibration_cv: 5
  tier2:
    name: "distilbert/distilbert-base-uncased"
    batch_size: 32
    learning_rate: 3.0e-5
    epochs: 3

ood_evaluation:
  xstest:
    dataset_id: "Paul/XSTest"
    fallback_id: "allenai/xstest-response"
    safe_samples: 250
    unsafe_samples: 200
  jailbreakbench:
    dataset_id: "JailbreakBench/JBB-Behaviors"
    behaviors_samples: 200

export:
  opset_version: 18
  quantization: "INT8_DYNAMIC"
  sla_latency_p99_cpu_ms: 15.0
