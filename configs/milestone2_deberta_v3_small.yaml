# AegisLLM - Milestone 2 Configuration (Single Source of Truth)
# Software Engineering for Deep Learning - ETSIINF (UPM)
# Authors: Evan Gendrot & Amaury Dubuc

project:
  name: "aegis-llm"
  milestone: "milestone-2-model-implementation"
  default_seed: 42
  multi_seeds: [42, 1337, 2026, 7, 99]

# Execution Profiles:
# - t4_optimized: 36,000 samples, batch_size=16 (accum=2), FP32, DeBERTa-v3-base Teacher (22 mins on T4)
# - high_compute_a100: 60,000 samples, DeBERTa-v3-large Teacher Distillation, FGM, Optuna, Model Soup
active_profile: "t4_optimized"

profiles:
  t4_optimized:
    target_size: 36000
    quotas:
      benign: 18000
      hard_negative_devops: 5400
      benign_general: 12600
      prompt_injection: 10800
      direct_override: 6300
      indirect_rag: 4500
      jailbreak: 7200
      jailbreak_persona: 4500
      jailbreak_hypothetical: 2700
    batch_size: 16
    gradient_accumulation_steps: 2
    precision: "fp32"
    teacher_distillation:
      enabled: true
      teacher_model: "microsoft/deberta-v3-base"
      teacher_batch_size: 16
      alpha_distill: 0.40
      temperature: 2.0
    adversarial_fgm:
      enabled: true
      epsilon: 0.50
      emb_names: ["word_embeddings"]
    model_soup:
      enabled: true
      top_k_checkpoints: 3

  high_compute_a100:
    target_size: 60000
    quotas:
      benign: 30000
      hard_negative_devops: 9000
      benign_general: 21000
      prompt_injection: 18000
      direct_override: 10500
      indirect_rag: 7500
      jailbreak: 12000
      jailbreak_persona: 7500
      jailbreak_hypothetical: 4500
    batch_size: 32
    gradient_accumulation_steps: 1
    precision: "bf16"
    teacher_distillation:
      enabled: true
      teacher_model: "microsoft/deberta-v3-large"
      teacher_batch_size: 16
      alpha_distill: 0.40
      temperature: 2.0
      epochs: 3
    adversarial_fgm:
      enabled: true
      epsilon: 0.50
      emb_names: ["word_embeddings"]
    optuna_study:
      enabled: true
      n_trials: 20
      pruner: "MedianPruner"
      metric: "val_tpr_at_1pct_fpr"
    model_soup:
      enabled: true
      top_k_checkpoints: 3

dataset:
  splits:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
  clustering:
    shingle_size: 5
    num_permutations: 128
    lsh_threshold: 0.80
  labels:
    0: "BENIGN"
    1: "PROMPT_INJECTION"
    2: "JAILBREAK"

model:
  backbone: "microsoft/deberta-v3-small"
  num_labels: 3
  max_sequence_length: 512
  pad_to_multiple_of: 8

training:
  precision: "fp32"
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 2
  epochs: 4
  optimizer:
    name: "adamw_torch"
    backbone_lr: 2.5e-5
    head_lr: 1.0e-4
    llrd_decay: 0.90
    beta1: 0.9
    beta2: 0.98
    eps: 1.0e-6
    weight_decay: 0.01
    max_grad_norm: 1.0
  lr_scheduler:
    name: "cosine"
    warmup_ratio: 0.10
  loss:
    name: "CostSensitiveAsymmetricFocalLoss"
    class_weights: [1.0, 1.35, 1.65]
    gammas: [2.5, 1.5, 1.5]
    beta_fp: 2.25
    label_smoothing: 0.03
  evaluation:
    eval_strategy: "steps"
    eval_steps: 175
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    early_stopping_patience: 3

calibration:
  method: "temperature_scaling"
  max_iter: 50

baselines:
  tier1:
    name: "TF-IDF + Calibrated LinearSVC"
    word_ngram_range: [1, 3]
    char_ngram_range: [3, 5]
    max_features: 50000
    sublinear_tf: true
    calibration_method: "sigmoid"
    calibration_cv: 5
  tier2:
    name: "distilbert/distilbert-base-uncased"
    batch_size: 32
    learning_rate: 3.0e-5
    epochs: 3

ood_evaluation:
  xstest:
    dataset_id: "Paul/XSTest"
    fallback_id: "allenai/xstest-response"
    safe_samples: 250
    unsafe_samples: 200
  jailbreakbench:
    dataset_id: "JailbreakBench/JBB-Behaviors"
    behaviors_samples: 200

export:
  opset_version: 18
  quantization: "INT8_DYNAMIC"
  sla_latency_p99_cpu_ms: 15.0
