project:
  name: "aegis-llm"
  milestone: "milestone-2-model-implementation"
  default_seed: 42
  multi_seeds: [42, 1337, 2026]

active_profile: "colab_pro_bf16"

profiles:
  colab_pro_bf16:
    precision: "bf16"
    tf32: true
    torch_compile: false
    auto_batch_scaling:
      a100_min_vram_gb: 35.0
      a100_batch_size: 64
      a100_grad_accum: 1
      l4_min_vram_gb: 18.0
      l4_batch_size: 32
      l4_grad_accum: 1
      fallback_batch_size: 16
      fallback_grad_accum: 2
    quotas:
      benign: 14000
      prompt_injection: 9000
      jailbreak: 5000
    teacher_distillation:
      enabled: true
      teacher_model: "microsoft/deberta-v3-base"
      teacher_batch_size: 32
      teacher_epochs: 3
      alpha_distill: 0.40
      temperature: 2.0
      cache_dtype: "float16"
    adversarial_fgm:
      enabled: true
      epsilon: 0.50
      emb_names: ["word_embeddings"]
    model_soup:
      enabled: true
      strategy: "greedy"
      max_candidates: 5

dataset:
  in_domain_sources:
    neuralchemy:
      dataset_id: "neuralchemy/Prompt-injection-dataset"
      config: "full"
      splits: ["train", "validation", "test"]
    prompt_shield:
      dataset_id: "hendzh/PromptShield"
      config: "default"
      splits: ["train", "validation"]
      max_samples: 10000
    safeguard:
      dataset_id: "xTRam1/safe-guard-prompt-injection"
      config: "default"
      splits: ["train", "test"]
    jackhhao_jailbreak:
      dataset_id: "jackhhao/jailbreak-classification"
      config: "default"
      splits: ["train", "test"]
    chatgpt_jailbreak:
      dataset_id: "rubend18/ChatGPT-Jailbreak-Prompts"
      config: "default"
      splits: ["train"]
    deepset:
      dataset_id: "deepset/prompt-injections"
      config: "default"
      splits: ["train", "test"]
  splits:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    n_folds: 20
  clustering:
    shingle_size: 5
    num_permutations: 128
    lsh_threshold: 0.75
  labels:
    0: "BENIGN"
    1: "PROMPT_INJECTION"
    2: "JAILBREAK"

model:
  backbone: "microsoft/deberta-v3-small"
  num_labels: 3
  max_sequence_length: 256
  extended_eval_length: 512
  pad_to_multiple_of: 8

training:
  precision: "bf16"
  tf32: true
  torch_compile: false
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  epochs: 4
  optimizer:
    name: "adamw_torch"
    backbone_lr: 2.5e-5
    head_lr: 1.0e-4
    llrd_decay: 0.90
    beta1: 0.9
    beta2: 0.98
    eps: 1.0e-6
    weight_decay: 0.01
    max_grad_norm: 1.0
  lr_scheduler:
    name: "cosine"
    warmup_ratio: 0.10
  loss:
    name: "CostSensitiveAsymmetricFocalLoss"
    class_weights: [1.0, 1.35, 3.01]
    gammas: [2.5, 1.5, 2.0]
    beta_fp: 2.25
    label_smoothing: 0.03
  evaluation:
    eval_strategy: "steps"
    eval_steps: 150
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    early_stopping_patience: 3

ablation:
  loss_variants: ["ce", "focal", "cs_afl"]

calibration:
  method: "temperature_scaling"
  max_iter: 50
  recalibrate_post_quantization: true

baselines:
  tier1:
    name: "TF-IDF + Calibrated LinearSVC"
    word_ngram_range: [1, 3]
    char_ngram_range: [3, 5]
    max_features: 50000
    sublinear_tf: true
    calibration_method: "sigmoid"
    calibration_cv: 5
  tier2:
    name: "distilbert/distilbert-base-uncased"
    batch_size: 32
    learning_rate: 3.0e-5
    epochs: 3

ood_evaluation:
  xstest:
    dataset_id: "Paul/XSTest"
    config: "default"
    split: "train"
  notinject:
    dataset_id: "leolee99/NotInject"
    config: "default"
    splits: ["NotInject_one", "NotInject_two", "NotInject_three"]
  jailbreakbench:
    dataset_id: "JailbreakBench/JBB-Behaviors"
    behaviors_config: "behaviors"
    judge_config: "judge_comparison"

quantization:
  opset_version: 18
  variants: ["fp32_opt", "int8_dynamic", "int8_static_qdq"]
  calibration_samples: 512
  calibration_method: "entropy"
  op_types_to_quantize: ["MatMul", "Gemm"]
  exclude_nodes_patterns: ["embeddings", "classifier", "LayerNorm"]
  sla_latency_p99_cpu_ms: 15.0
