[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-llm"
version = "1.0.0"
description = "Inline CPU-only AI Application Security Gateway for real-time OWASP LLM01 prompt injection and jailbreak mitigation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Evan Gendrot", email = "evangendrot.35@gmail.com" },
    { name = "Amaury Dubuc", email = "amaury.dubuc@insa-rennes.fr" },
]
keywords = [
    "cybersecurity",
    "ai-security",
    "prompt-injection",
    "jailbreak",
    "llm-firewall",
    "owasp-llm01",
    "onnxruntime",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# Production gateway extra: strictly zero PyTorch and zero HuggingFace Transformers
runtime = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
]
train = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "datasketch>=1.6.5",
    "safetensors>=0.4.3",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "PyYAML>=6.0.1",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]
bench = [
    "httpx>=0.27.0",
    "psutil>=6.0.0",
]
# Legacy aliases kept for backwards compatibility
proxy = ["aegis-llm[runtime]"]
onnx = ["onnxruntime>=1.18.0", "tokenizers>=0.19.0"]
all = ["aegis-llm[runtime,dev,bench]"]

[project.scripts]
aegis-proxy = "aegis.proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/aegis"]
