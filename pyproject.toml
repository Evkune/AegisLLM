[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-llm"
version = "0.1.0"
description = "AI Application Security Gateway for real-time prompt injection and jailbreak mitigation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Evan Gendrot", email = "evangendrot.35@gmail.com" }
]
keywords = ["cybersecurity", "ai-security", "prompt-injection", "jailbreak", "llm-firewall", "owasp-llm01"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
proxy = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
]
onnx = [
    "onnxruntime>=1.16.0",
    "tokenizers>=0.15.0",
]
all = [
    "aegis-llm[dev,proxy,onnx]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
